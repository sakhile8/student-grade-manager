<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Grade Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            color: #172b4d;
        }

        main {
            max-width: 48rem;
            margin: 0 auto;
        }

        form {
            display: grid;
            gap: 0.75rem;
            max-width: 24rem;
        }

        input,
        button {
            font: inherit;
            padding: 0.5rem;
        }

        table {
            border-collapse: collapse;
            margin-top: 1rem;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #8292a8;
            padding: 0.5rem;
            text-align: left;
        }

        .status {
            min-height: 1.5em;
        }
    </style>
</head>

<body>
    <main>
        <h1>Student Grade Manager</h1>

        <form id="student-form">
            <label for="student-name">Student Name</label>
            <input id="student-name" name="student-name" type="text" required>

            <label for="student-grade">Grade (0-100)</label>
            <input id="student-grade" name="student-grade" type="number" min="0" max="100" required>

            <button id="submit-student" type="submit">Add Student</button>
        </form>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>

        <section aria-labelledby="students-heading">
            <h2 id="students-heading">Students</h2>
            <table id="student-table">
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Grade</th>
                    </tr>
                </thead>
                <tbody id="student-list"></tbody>
            </table>
        </section>
    </main>

    <script>
        const form = document.getElementById("student-form");
        const nameInput = document.getElementById("student-name");
        const gradeInput = document.getElementById("student-grade");
        const studentList = document.getElementById("student-list");
        const formStatus = document.getElementById("form-status");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = nameInput.value.trim();
            const grade = gradeInput.value;

            if (!name || !gradeInput.validity.valid) {
                formStatus.textContent = "Enter a name and a grade from 0 to 100.";
                return;
            }

            const row = document.createElement("tr");
            const nameCell = document.createElement("td");
            const gradeCell = document.createElement("td");

            nameCell.textContent = name;
            gradeCell.textContent = grade;
            row.append(nameCell, gradeCell);

            studentList.appendChild(row);

            nameInput.value = "";
            gradeInput.value = "";
            formStatus.textContent = `Added ${name}.`;
        });
    </script>

</body>
</html>
